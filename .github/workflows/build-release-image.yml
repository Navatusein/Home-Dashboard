name: Build Release Image

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-to-registry:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write

    outputs:
      digest: ${{ steps.push.outputs.digest }}
      version: ${{ steps.meta.outputs.version }}
      image: ${{ steps.image.outputs.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to the Container registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: image
        run: echo "name=${IMAGE,,}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  create-gitops-pull-request:
    name: Create GitOps pull request
    needs: build-and-push-to-registry
    runs-on: ubuntu-latest
    permissions: {}

    env:
      GITOPS_REPOSITORY: Navatusein/Home-Lab
      GITOPS_FILE: kubernetes/main-k8s/apps/application/home-dashboard/app/helm-release.yaml
      DIGEST: ${{ needs.build-and-push-to-registry.outputs.digest }}
      VERSION: ${{ needs.build-and-push-to-registry.outputs.version }}
      IMAGE: ${{ needs.build-and-push-to-registry.outputs.image }}
      GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}

    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ${{ env.GITOPS_REPOSITORY }}
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Update image tag
        id: update
        run: |
          OLD_VERSION=$(sed -nE 's|^\s*tag:\s*([^@[:space:]]+).*$|\1|p' "$GITOPS_FILE" | head -n1)
          sed -i -E "s|^(\s*tag:\s*).+$|\1${VERSION}@${DIGEST}|" "$GITOPS_FILE"
          git diff --quiet -- "$GITOPS_FILE" && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"
          grep -q "tag: ${VERSION}@${DIGEST}" "$GITOPS_FILE"

          IFS=. read -r OLD_MAJOR OLD_MINOR _ <<< "$OLD_VERSION"
          IFS=. read -r NEW_MAJOR NEW_MINOR _ <<< "$VERSION"
          if [ "$OLD_MAJOR" != "$NEW_MAJOR" ]; then
            PREFIX="feat(container)!"
          elif [ "$OLD_MINOR" != "$NEW_MINOR" ]; then
            PREFIX="feat(container)"
          else
            PREFIX="chore(container)"
          fi
          echo "title=${PREFIX}: update image ${IMAGE} ( ${OLD_VERSION} → ${VERSION} )" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.update.outputs.changed == 'true'
        env:
          TITLE: ${{ steps.update.outputs.title }}
        run: |
          BRANCH="chore/home-dashboard-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -am "$TITLE"
          git push --force origin "$BRANCH"
          gh pr create \
            --repo "$GITOPS_REPOSITORY" \
            --head "$BRANCH" \
            --base main \
            --title "$TITLE" \
            --body "Digest \`${DIGEST}\` from ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            || gh pr edit "$BRANCH" --repo "$GITOPS_REPOSITORY" --title "$TITLE"
